[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wxcli"
version = "0.7.2"
description = "Windows CLI for WeChat Official Account discovery, evidence, and safe draft preparation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "WeChat OA contributors" }]
dependencies = [
    "typer>=0.12,<1.0",
    "click>=8.1,<9.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "markdownify>=0.13,<1.0",
    "playwright>=1.45,<2.0",
    "keyring>=25.0,<26.0",
    "python-docx>=1.1,<2.0",
    "Pillow>=10.4,<12.0",
    "zxing-cpp>=3.1,<4.0",
]

[project.urls]
Homepage = "https://github.com/qiuC123/qiuC-tools/tree/main/CLI/wechat-oa"
Repository = "https://github.com/qiuC123/qiuC-tools"
Issues = "https://github.com/qiuC123/qiuC-tools/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5,<7",
    "pyinstaller>=6.7,<7.0",
]

[project.scripts]
wxcli = "wxcli.cli:main"
wechat-oa = "wxcli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
