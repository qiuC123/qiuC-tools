name: WeChat OA CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wechat-oa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: pwsh
    working-directory: CLI/wechat-oa

jobs:
  quality:
    name: Tests and type checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CLI/wechat-oa/pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Run offline test suite
        run: python -m pytest -q

      - name: Run strict type checks
        run: python -m mypy src

      - name: Smoke-test both command names and offline Doctor
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "wechat-oa-ci"
          wechat-oa --version
          wxcli --version
          $doctor = wechat-oa --json doctor | ConvertFrom-Json
          if (-not $doctor.ok) {
              throw "Offline Doctor reported failure."
          }
          $liveChecks = @(
              $doctor.data.checks |
                  Where-Object {
                      $_.name -in @(
                          "network",
                          "stable_token",
                          "ip_allowlist",
                          "draft_permission",
                          "published_permission"
                      )
                  }
          )
          if (@($liveChecks | Where-Object { $_.status -ne "skip" }).Count -gt 0) {
              throw "Offline Doctor attempted an unauthorized live check."
          }

  package-smoke:
    name: Windows package smoke
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CLI/wechat-oa/pyproject.toml

      - name: Build and smoke-test the Windows release package
        run: .\scripts\build-release.ps1

      - name: Upload temporary package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wechat-oa-windows-x64-${{ github.sha }}
          path: |
            CLI/wechat-oa/dist/release/*.zip
            CLI/wechat-oa/dist/release/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
